name: plugins-release

on:
  push:
    tags:
      - "plugins-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag against modVersion
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          FULL="${TAG#plugins-v}"
          BASE="${FULL%%-*}"
          PROP="$(grep '^modVersion=' apps/plugins/gradle.properties | cut -d= -f2)"
          if [ "$BASE" != "$PROP" ]; then
            echo "Tag base $BASE does not match modVersion $PROP."
            exit 1
          fi
          case "$FULL" in
            *-alpha*) CHANNEL="alpha" ;;
            *-beta*|*-rc*) CHANNEL="beta" ;;
            *) CHANNEL="release" ;;
          esac
          {
            echo "full=$FULL"
            echo "channel=$CHANNEL"
            echo "title=minelog plugins v$FULL"
          } >> "$GITHUB_OUTPUT"

      - name: Build plugins
        working-directory: apps/plugins
        run: ./gradlew clean build

      - name: Collect changelog section
        run: |
          awk -v ver="${{ steps.meta.outputs.full }}" '
            $0 == "## "ver || index($0, "## "ver" ") == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' apps/plugins/CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > /tmp/plugin-notes.md
          if [ ! -s /tmp/plugin-notes.md ]; then
            echo "No CHANGELOG section for ${{ steps.meta.outputs.full }}."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ steps.meta.outputs.channel }}" != "release" ]; then
            FLAGS="--prerelease"
          fi
          JARS="apps/plugins/platform-bukkit/build/libs/minelog-bukkit-*.jar apps/plugins/platform-bungee/build/libs/minelog-bungee-*.jar apps/plugins/platform-velocity/build/libs/minelog-velocity-*.jar"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run after a partial failure: refresh notes and files.
            gh release edit "$GITHUB_REF_NAME" \
              --title "${{ steps.meta.outputs.title }}" \
              --notes-file /tmp/plugin-notes.md $FLAGS
            # shellcheck disable=SC2086
            gh release upload "$GITHUB_REF_NAME" --clobber $JARS
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" \
              --title "${{ steps.meta.outputs.title }}" \
              --notes-file /tmp/plugin-notes.md \
              $FLAGS \
              $JARS
          fi

      - name: Check Modrinth identity
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          echo "Token owner:"
          curl -s -H "Authorization: $MODRINTH_TOKEN" https://api.modrinth.com/v2/user | jq '{username: .username, id: .id}'
          echo "Project team:"
          curl -s https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID:-minelog}/members | jq '[.[] | {user: .user.username, role: .role}]'

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          BUKKIT_JAR=(apps/plugins/platform-bukkit/build/libs/minelog-bukkit-*.jar)
          BUNGEE_JAR=(apps/plugins/platform-bungee/build/libs/minelog-bungee-*.jar)
          VELOCITY_JAR=(apps/plugins/platform-velocity/build/libs/minelog-velocity-*.jar)
          node apps/plugins/scripts/publish-modrinth.mjs \
            --version "${{ steps.meta.outputs.full }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --channel "${{ steps.meta.outputs.channel }}" \
            --changelog-file /tmp/plugin-notes.md \
            --file "bukkit=$BUKKIT_JAR" \
            --file "bungee=$BUNGEE_JAR" \
            --file "velocity=$VELOCITY_JAR"

      - name: Resolve Hangar channel
        id: hangar
        run: |
          case "${{ steps.meta.outputs.channel }}" in
            release) echo "channel=Release" >> "$GITHUB_OUTPUT" ;;
            beta) echo "channel=Beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=Alpha" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check Hangar for this version
        id: hangar-check
        run: |
          FULL="${{ steps.meta.outputs.full }}"
          LIST="$(curl -s "https://hangar.papermc.io/api/v1/projects/LogicByteStudios/minelog/versions?limit=25&offset=0" || true)"
          if echo "$LIST" | jq -e --arg v "$FULL" '.result // [] | map(.name) | index($v)' >/dev/null 2>&1; then
            echo "Version $FULL is already on Hangar, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Hangar
        if: steps.hangar-check.outputs.skip != 'true'
        working-directory: apps/plugins
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_VERSION: ${{ steps.meta.outputs.full }}
          HANGAR_CHANNEL: ${{ steps.hangar.outputs.channel }}
        run: ./gradlew publishPluginPublicationToHangar --stacktrace

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          BUKKIT_JAR=(apps/plugins/platform-bukkit/build/libs/minelog-bukkit-*.jar)
          BUNGEE_JAR=(apps/plugins/platform-bungee/build/libs/minelog-bungee-*.jar)
          VELOCITY_JAR=(apps/plugins/platform-velocity/build/libs/minelog-velocity-*.jar)
          node apps/plugins/scripts/publish-curseforge.mjs \
            --version "${{ steps.meta.outputs.full }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --channel "${{ steps.meta.outputs.channel }}" \
            --changelog-file /tmp/plugin-notes.md \
            --file "bukkit=$BUKKIT_JAR" \
            --file "bungee=$BUNGEE_JAR" \
            --file "velocity=$VELOCITY_JAR"
