name: minelog
version: ${modVersion}
main: org.minelog.bukkit.MinelogPlugin
description: Share server logs on minelog.org with a link.
author: LogicByte
website: https://minelog.org
softdepend: [Skript]
commands:
  minelog:
    description: Share a log on minelog.org.
    usage: /minelog share [file] | delete <id> | auth <key> | status | test | disconnect | reload
    aliases: [mlog]
    permission: minelog.share
permissions:
  minelog.share:
    description: Share logs on minelog.org.
    default: op
  minelog.delete:
    description: Delete own uploads from minelog.org.
    default: op
  minelog.reload:
    description: Reload the minelog settings.
    default: op
  minelog.connect:
    description: Connect this server to your minelog account.
    default: op
  minelog.admin:
    description: Full minelog access.
    default: op
    children:
      minelog.share: true
      minelog.delete: true
      minelog.reload: true
      minelog.connect: true
